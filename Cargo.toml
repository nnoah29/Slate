[package]
name = "slate"
version = "0.1.0"
edition = "2024"
authors = ["Slate Contributors"]
description = "Minimalist native Linux Markdown notes application"
license = "MIT"

[lib]
name = "slate"
path = "src/lib.rs"

[[bin]]
name = "slate"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_18"] }
libadwaita = { version = "0.9", features = ["v1_8"] }
sourceview5 = "0.11"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
similar = { version = "2.7", features = ["text"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.17"
